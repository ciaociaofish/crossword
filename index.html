<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文填字游戏</title>
<style>
  :root{--paper:#f6f1e7;--ink:#22201c;--line:#c9bfab;--accent:#b3541e;--muted:#7a7263}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
    display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .wrap{max-width:760px;width:100%}
  h1{font-size:34px;letter-spacing:.18em;margin:0 0 8px}
  .sub{color:var(--muted);font-size:14px;letter-spacing:.05em;margin-bottom:34px;line-height:1.8}
  .cards{display:flex;gap:20px;flex-wrap:wrap}
  a.card{flex:1 1 300px;display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);background:#fffdf8;padding:26px 24px;border-radius:4px;
    transition:.15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
  a.card.dark{background:#16181d;border-color:#3b4048;color:#f0ece3}
  a.card.dark:hover{border-color:#d2913f}
  .t{font-size:21px;letter-spacing:.12em;margin-bottom:10px}
  .d{font-size:13px;line-height:1.8;color:var(--muted)}
  a.card.dark .d{color:#8b9099}
  .meta{margin-top:14px;font-size:12px;color:var(--accent);letter-spacing:.08em}
  a.card.dark .meta{color:#d2913f}
  footer{margin-top:34px;font-size:12px;color:var(--muted);line-height:1.9;
    border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>中 文 填 字 游 戏</h1>
  <div class="sub">15 × 15 · 成语典故、诗句熟语、摇滚电影、神话江湖、科学地理<br>直接用中文输入法打字，可以检查答案、要提示</div>
  <div class="cards">
    <a class="card" href="standard.html">
      <div class="t">标 准 版</div>
      <div class="d">雅俗共赏。成语、诗句、名人名作与科学常识混搭，大部分人能做出七八成。</div>
      <div class="meta">60 条谜面 →</div>
    </a>
    <a class="card dark" href="hardcore.html">
      <div class="t">硬 核 版</div>
      <div class="d">冷门典故、古籍名画、理论物理、哲学流派。谜面只给线索，不给定义。</div>
      <div class="meta">60 条谜面 →</div>
    </a>
  </div>
  <footer>
    每格填一个汉字 · 方向键移动 · 空格键切换横／纵 · Tab 跳到下一个词<br>
    手机上也能玩，横屏体验更好。
  </footer>
</div>
</body>
</html>
